<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Little Learners</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#203047;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;min-height:100dvh}.app{max-width:520px;margin:auto;min-height:100dvh;padding:18px 16px 26px;display:flex;flex-direction:column;gap:16px}header{display:flex;justify-content:space-between;align-items:center;min-height:45px}header strong{font-size:21px}.panel{background:white;border-radius:24px;box-shadow:0 8px 28px #243a5a12;padding:24px 20px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px}.intro{text-align:center}.intro h1{font-size:34px;margin:0 0 8px}.intro p,.muted{color:#63738a}.mode{border:0;border-radius:18px;padding:16px;display:flex;align-items:center;gap:15px;width:100%;text-align:left;color:#203047;cursor:pointer}.mode b{display:block;font-size:19px;margin-bottom:5px}.mode small{font-size:14px;color:#53647a}.tile{width:66px;height:66px;border-radius:14px;display:grid;place-items:center;color:white;font-weight:900;font-size:23px;flex-shrink:0}.blue{background:#4169d6}.green{background:#139873}.orange{background:#d98a2b}.mode:nth-of-type(1){background:#eaf0ff}.mode:nth-of-type(2){background:#e6f6f0}.mode:nth-of-type(3){background:#fff2e1}.chevron{margin-left:auto;font-size:26px}.topline{display:flex;justify-content:space-between;color:#63738a;font-size:13px;font-weight:700;letter-spacing:.03em}.track{height:9px;border-radius:20px;background:#e8edf4;overflow:hidden;margin-top:12px}.bar{height:100%;background:#4a9b79;width:0;transition:width .25s}.question{text-align:center;font-weight:700;color:#61718a;font-size:19px}.symbol{text-align:center;font-size:clamp(145px,42vw,210px);font-weight:800;line-height:1.05;color:#4169d6;min-height:210px;display:grid;place-items:center;overflow-wrap:anywhere}.symbol.word-letter{font-size:130px;min-height:135px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:4px solid #8bb4ff;outline-offset:3px}.btn{min-height:72px;border-radius:17px;border:0;font-weight:800;font-size:21px;cursor:pointer}.wrong{background:#fff0f0;color:#ba3542;border:2px solid #f3b5ba}.correct{background:#149b74;color:white}.home{border:1px solid #d7e0eb;background:white;border-radius:12px;padding:11px 15px;color:#30445d;font-weight:700;cursor:pointer}.choices{display:grid;gap:12px}.choice{border:2px solid #e0e7f0;border-radius:17px;background:#f7f9fc;color:#203047;min-height:70px;font-size:28px;font-weight:800;cursor:pointer}.choice.good{background:#dcf8e9;border-color:#1d9c70;color:#136b4e}.choice.bad{background:#ffeded;border-color:#d9505d;color:#ad2938}.choice:disabled,.btn:disabled{cursor:default}.feedback{height:30px;text-align:center;font-size:20px;font-weight:800;color:#18805d}.feedback.miss{color:#bd414b}.result{text-align:center}.result .trophy{font-size:72px}.result h1{font-size:36px;margin:8px 0}.result .score{font-size:62px;font-weight:900;color:#4169d6;margin:12px 0}.primary{background:#4169d6;color:white}.secondary{background:#eef2f8;color:#30445d}.result-actions{display:grid;gap:12px;margin-top:25px}.hidden{display:none!important}@media(max-height:700px){.panel{gap:13px;padding:16px}.symbol{min-height:160px;font-size:140px}.symbol.word-letter{min-height:110px;font-size:105px}.btn{min-height:62px}.choice{min-height:58px}.app{gap:8px;padding-top:8px}}
.mode.clock-mode{background:#f1eaff}.clock-mode .tile{background:#8056c7}.difficulty-list{display:grid;gap:12px}.difficulty{border:2px solid #e0e7f0;border-radius:17px;background:#f7f9fc;color:#203047;min-height:68px;padding:12px 16px;text-align:left;cursor:pointer}.difficulty b{display:block;font-size:20px;margin-bottom:4px}.difficulty small{color:#63738a;font-size:14px}.clock-wrap{width:min(72vw,270px);aspect-ratio:1;margin:auto;display:grid;place-items:center}.clock-face{width:100%;height:100%;overflow:visible}.clock-answer{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;max-width:340px;width:100%;margin:auto}.clock-answer label{display:grid;gap:6px;text-align:center;font-weight:700;color:#53647a}.clock-answer input{width:100%;height:62px;border:2px solid #dce4ee;border-radius:15px;background:#f8fafd;color:#203047;font:800 27px Arial,Helvetica,sans-serif;text-align:center;outline:none}.clock-answer input:focus{border-color:#4169d6;box-shadow:0 0 0 3px #4169d626}.clock-colon{font-size:32px;font-weight:800;padding-bottom:10px}.clock-submit{width:100%;min-height:62px;border:0;border-radius:16px;background:#4169d6;color:white;font-size:20px;font-weight:800;cursor:pointer}.clock-input-error{color:#bd414b!important}@media(max-height:700px){.clock-wrap{width:min(52vw,210px)}.clock-answer input{height:54px}}
</style>
</head>
<body><main class="app"><header><strong>✦ Little Learners</strong><button class="home hidden" id="homeBtn" type="button">⌂ Home</button></header><section class="panel" id="screen" aria-live="polite"></section></main>
<script>
'use strict';
const screen=document.getElementById('screen'),homeBtn=document.getElementById('homeBtn');
const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const WORDS={A:['Apple','Ant','Arrow'],B:['Ball','Bear','Boat'],C:['Cat','Cake','Car'],D:['Dog','Duck','Door'],F:['Fish','Fan','Frog'],H:['Hat','Horse','House'],M:['Moon','Milk','Mouse'],P:['Pig','Pizza','Pencil'],S:['Sun','Sock','Star'],T:['Tree','Tiger','Train']};
const MODES={letters:{label:'Letter Challenge',total:26},numbers:{label:'Number Challenge',total:21},words:{label:'Starting Letters',total:10}};
let state=null,pending=null;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function clear(){if(pending!==null){clearTimeout(pending);pending=null}screen.replaceChildren()}
function button(label,cls,action){const b=el('button',cls,label);b.type='button';b.addEventListener('click',action);return b}
function showHome(){state=null;clear();homeBtn.classList.add('hidden');const intro=el('div','intro');intro.append(el('h1','','Let’s Play!'),el('p','','Choose a learning game'));screen.append(intro);for(const [mode,icon,sub,color] of [['letters','ABC','Name all 26 letters','blue'],['numbers','123','Name numbers 0–20','green'],['words','A+','Find the matching word · 10 rounds','orange']]){const b=button('','mode',()=>start(mode)),tile=el('span','tile '+color,icon),txt=el('span');txt.append(el('b','',MODES[mode].label),el('small','',sub));b.append(tile,txt,el('span','chevron','›'));screen.append(b)}const clock=button('','mode clock-mode',showClockLevels),tile=el('span','tile','◷'),txt=el('span');txt.append(el('b','','Clock Challenge'),el('small','','Read the time · 10 rounds'));clock.append(tile,txt,el('span','chevron','›'));screen.append(clock)}
function start(mode){const questions=mode==='letters'?shuffle(LETTERS):mode==='numbers'?shuffle(Array.from({length:21},(_,i)=>i)):shuffle(Object.keys(WORDS)).map(letter=>{const correct=WORDS[letter][Math.floor(Math.random()*WORDS[letter].length)];const distractors=shuffle(Object.keys(WORDS).filter(k=>k!==letter)).slice(0,2).map(k=>WORDS[k][Math.floor(Math.random()*WORDS[k].length)]);return {letter,correct,options:shuffle([correct,...distractors])}});state={mode,questions,index:0,score:0,locked:false};homeBtn.classList.remove('hidden');render()}function showClockLevels(){state=null;clear();homeBtn.classList.remove('hidden');const intro=el('div','intro');intro.append(el('h1','','Clock Challenge'),el('p','','Choose a difficulty'));screen.append(intro);const list=el('div','difficulty-list');[['easy','Easy','Quarter hours: :00, :15, :30, :45'],['medium','Medium','Every 5 minutes'],['hard','Hard','Every minute']].forEach(([level,name,sub])=>{const b=button('', 'difficulty',()=>startClock(level));b.append(el('b','',name),el('small','',sub));list.append(b)});screen.append(list)}
function startClock(level){const step={easy:15,medium:5,hard:1}[level];const pool=[];for(let hour=1;hour<=12;hour++)for(let minute=0;minute<60;minute+=step)pool.push({hour,minute});const questions=shuffle(pool).slice(0,10);state={mode:'clock',level,questions,index:0,score:0,locked:false};homeBtn.classList.remove('hidden');render()}

function render(){clear();if(!state)return;if(state.mode==='clock'){renderClock();return}const {mode,index,score,questions}=state;if(index>=questions.length){result();return}const top=el('div'),line=el('div','topline');line.append(el('span','',`QUESTION ${index+1} OF ${questions.length}`),el('span','',`Score: ${score}`));const track=el('div','track'),bar=el('div','bar');bar.style.width=(100*index/questions.length)+'%';track.append(bar);top.append(line,track);screen.append(top);const q=questions[index];screen.append(el('div','question',mode==='letters'?'What letter is this?':mode==='numbers'?'What number is this?':'Which word starts with'));screen.append(el('div','symbol'+(mode==='words'?' word-letter':''),mode==='words'?q.letter:String(q)));if(mode==='words'){const choices=el('div','choices');q.options.forEach(word=>choices.append(button(word,'choice',ev=>answer(word===q.correct,ev.currentTarget,q.correct))));screen.append(choices)}else{const actions=el('div','actions');actions.append(button('✕ Wrong','btn wrong',()=>answer(false)),button('✓ Correct','btn correct',()=>answer(true)));screen.append(actions)}screen.append(el('div','feedback',''))}
function renderClock(){const {index,score,questions}=state;if(index>=questions.length){result();return}const top=el('div'),line=el('div','topline');line.append(el('span','','QUESTION '+(index+1)+' OF '+questions.length),el('span','','Score: '+score));const track=el('div','track'),bar=el('div','bar');bar.style.width=(100*index/questions.length)+'%';track.append(bar);top.append(line,track);screen.append(top,el('div','question','What time does the clock show?'));const q=questions[index],wrap=el('div','clock-wrap'),svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 240 240');svg.setAttribute('class','clock-face');svg.setAttribute('role','img');svg.setAttribute('aria-label','An analog clock showing an unknown time');const ns=svg.namespaceURI;const circle=document.createElementNS(ns,'circle');circle.setAttribute('cx','120');circle.setAttribute('cy','120');circle.setAttribute('r','108');circle.setAttribute('fill','#fff');circle.setAttribute('stroke','#4169d6');circle.setAttribute('stroke-width','5');svg.append(circle);for(let n=1;n<=12;n++){const angle=n*Math.PI/6-Math.PI/2,tx=120+Math.cos(angle)*82,ty=120+Math.sin(angle)*82+7,t=document.createElementNS(ns,'text');t.setAttribute('x',tx);t.setAttribute('y',ty);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','18');t.setAttribute('font-weight','700');t.setAttribute('fill','#30445d');t.textContent=String(n);svg.append(t)}for(let n=0;n<60;n++){const angle=n*Math.PI/30-Math.PI/2,r1=n%5===0?96:101,r2=105,l=document.createElementNS(ns,'line');l.setAttribute('x1',120+Math.cos(angle)*r1);l.setAttribute('y1',120+Math.sin(angle)*r1);l.setAttribute('x2',120+Math.cos(angle)*r2);l.setAttribute('y2',120+Math.sin(angle)*r2);l.setAttribute('stroke',n%5===0?'#60738c':'#b9c5d4');l.setAttribute('stroke-width',n%5===0?'2':'1');svg.append(l)}const hand=(angle,len,width,color)=>{const a=angle*Math.PI/180-Math.PI/2,line=document.createElementNS(ns,'line');line.setAttribute('x1','120');line.setAttribute('y1','120');line.setAttribute('x2',120+Math.cos(a)*len);line.setAttribute('y2',120+Math.sin(a)*len);line.setAttribute('stroke',color);line.setAttribute('stroke-width',width);line.setAttribute('stroke-linecap','round');svg.append(line)};hand((q.hour%12)*30+q.minute*.5,54,7,'#203047');hand(q.minute*6,79,4,'#4169d6');const pin=document.createElementNS(ns,'circle');pin.setAttribute('cx','120');pin.setAttribute('cy','120');pin.setAttribute('r','5');pin.setAttribute('fill','#d98a2b');svg.append(pin);wrap.append(svg);screen.append(wrap);const form=el('form','clock-answer');form.setAttribute('aria-label','Enter the time');const hourLabel=el('label','','Hour'),hourInput=el('input');hourInput.type='text';hourInput.inputMode='numeric';hourInput.autocomplete='off';hourInput.maxLength=2;hourInput.placeholder='1–12';hourInput.setAttribute('aria-label','Hour');hourInput.required=true;hourLabel.append(hourInput);const colon=el('span','clock-colon',':');colon.setAttribute('aria-hidden','true');const minuteLabel=el('label','','Minutes'),minuteInput=el('input');minuteInput.type='text';minuteInput.inputMode='numeric';minuteInput.autocomplete='off';minuteInput.maxLength=2;minuteInput.placeholder='00–59';minuteInput.setAttribute('aria-label','Minutes');minuteInput.required=true;minuteLabel.append(minuteInput);form.append(hourLabel,colon,minuteLabel);form.addEventListener('submit',ev=>{ev.preventDefault();submitClock(hourInput,minuteInput)});screen.append(form);const submit=button('Check time','clock-submit',()=>form.requestSubmit());screen.append(submit);const feedback=el('div','feedback');feedback.setAttribute('aria-live','polite');screen.append(feedback);hourInput.focus({preventScroll:true})}
function submitClock(hourInput,minuteInput){if(!state||state.locked)return;const hourText=hourInput.value.trim(),minuteText=minuteInput.value.trim(),h=Number(hourText),m=Number(minuteText),feedback=screen.querySelector('.feedback');if(!/^\d{1,2}$/.test(hourText)||h<1||h>12||!/^\d{1,2}$/.test(minuteText)||m<0||m>59){feedback.textContent='Enter an hour from 1 to 12 and minutes from 00 to 59.';feedback.classList.add('miss');return}const q=state.questions[state.index];if(h===q.hour&&m===q.minute){state.score++;state.locked=true;feedback.classList.remove('miss');feedback.textContent='✓ That’s right!';pending=setTimeout(()=>{pending=null;if(!state)return;state.index++;state.locked=false;render()},1000)}else{feedback.textContent='Not quite. Try again!';feedback.classList.add('miss');minuteInput.select()}}
function answer(isCorrect,selected,correctWord){if(!state||state.locked)return;state.locked=true;if(isCorrect)state.score++;const feedback=screen.querySelector('.feedback');feedback.textContent=isCorrect?'✓ Great job!':'✕ Try again next time!';if(!isCorrect)feedback.classList.add('miss');screen.querySelectorAll('.choice,.actions .btn').forEach(b=>{b.disabled=true;if(correctWord){if(b.textContent===correctWord)b.classList.add('good');else if(b===selected)b.classList.add('bad')}});pending=setTimeout(()=>{pending=null;if(!state)return;state.index++;state.locked=false;render()},1000)}
function result(){clear();const r=el('div','result');r.append(el('div','trophy','🏆'),el('h1','','Great Job!'),el('p','muted','You finished the challenge!'),el('div','score',`${state.score} / ${state.questions.length}`));const actions=el('div','result-actions');actions.append(button('↻ Play Again','btn primary',()=>state.mode==='clock'?startClock(state.level):start(state.mode)),button('⌂ Home','btn secondary',showHome));r.append(actions);screen.append(r)}
homeBtn.addEventListener('click',showHome);showHome();
</script></body></html>
